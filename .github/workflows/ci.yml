name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 린트 · 타입 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: 웹 빌드
        run: pnpm --filter @issue-desk/web build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: DB 마이그레이션 · RLS 테스트 (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: 로컬 Supabase 시작 (마이그레이션 + seed 적용)
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: DB 테스트
        run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Functions 타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
        working-directory: supabase/functions
