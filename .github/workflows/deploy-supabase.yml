# main 에 반영되면 운영 Supabase(qrgcauiomsozqoyxrkvo)에 DB 마이그레이션과 Edge Functions 배포
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  : supabase.com → Account → Access Tokens 에서 발급
#   SUPABASE_DB_PASSWORD   : 프로젝트 생성 시 정한 DB 비밀번호
#   SUPABASE_PROJECT_REF   : qrgcauiomsozqoyxrkvo
#   SITE_URL               : Vercel 운영 주소 (예: https://cimsys.vercel.app)
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: 프로젝트 연결
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: 적용될 마이그레이션 확인
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: DB 마이그레이션 적용
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions 비밀값
        run: supabase secrets set SITE_URL="${{ secrets.SITE_URL }}" --project-ref "$PROJECT_REF"
      - name: Edge Functions 배포
        run: supabase functions deploy --project-ref "$PROJECT_REF"
